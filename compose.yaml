services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfahack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-alfahack}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-alfahack}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alfahack}
    command: ["python", "-m", "backend.manage", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

  seed:
    build: .
    env_file: .env
    environment: *app-environment
    command: ["python", "-m", "backend.manage", "seed-demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]

  api:
    build: .
    env_file: .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment: *app-environment
    command: ["python", "-m", "backend.worker"]
    depends_on:
      seed:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  postgres_data:
