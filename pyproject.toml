[project]
name = "alfahack-solution"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4", "pandas>=2.2,<3",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
pythonpath = [".", "ml/src"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["ml/src", "ml/tests", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
