databases:
  - name: alfa-hack-db
    databaseName: alfahack
    user: alfahack
    plan: free

services:
  - type: web
    name: alfa-hack-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m backend.serve
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alfa-hack-db
          property: connectionString
      - key: DATA_MODE
        value: organizers
      - key: ORGANIZER_DATA_DIR
        value: /app/ml/data
      - key: LLM_MODE
        value: offline
      - key: ALLOWED_ORIGINS
        sync: false
